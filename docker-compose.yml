services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  chatbot:
    build: .
    depends_on:
      - ollama
    environment:
      MODEL: qwen2.5:3b
      OLLAMA_URL: http://ollama:11434
    stdin_open: true
    tty: true

volumes:
  ollama:
